<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 452" width="948" height="452" role="img" aria-label="Hybrid dense plus BM25 retrieval with RRF fusion">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
</defs>
<text x="28" y="34" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e293b">Hybrid retrieval: two signals that fail differently</text>
<text x="28" y="56" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b">Embeddings encode topic, not digits. BM25 matches literal tokens and ignores meaning.</text>
<rect x="36" y="148" width="150" height="54" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
<text x="111.0" y="179.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1e293b">Question</text>
<line x1="186" y1="162" x2="234" y2="122" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="186" y1="188" x2="234" y2="246" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="234" y="94" width="244" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
<text x="356.0" y="118.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e293b">Dense  ·  nomic-embed-text</text>
<text x="356.0" y="136.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748b">semantic similarity, cosine</text>
<text x="250" y="172" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#6366f1">strong: paraphrase, concepts</text>
<text x="250" y="186" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#6366f1">weak:   exact digits</text>
<rect x="234" y="218" width="244" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
<text x="356.0" y="242.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e293b">Lexical  ·  BM25</text>
<text x="356.0" y="260.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748b">exact token overlap</text>
<text x="250" y="296" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#10b981">strong: numbers, names, IDs</text>
<text x="250" y="310" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#10b981">weak:   semantics, synonyms</text>
<line x1="478" y1="124" x2="544" y2="172" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="478" y1="248" x2="544" y2="200" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="544" y="156" width="168" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="628.0" y="180.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1e293b">RRF fusion</text>
<text x="628.0" y="198.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748b">ranks only, never scores</text>
<line x1="712" y1="186" x2="764" y2="186" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="764" y="156" width="150" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
<text x="839.0" y="180.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">top-4 chunks</text>
<text x="839.0" y="198.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748b">mixed modality</text>
<rect x="36" y="344" width="878" height="84" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
<text x="60" y="374" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#1e293b">score(d)  =  1 / (60 + rank_dense(d))  +  1 / (60 + rank_bm25(d))</text>
<text x="60" y="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b">Rank-based, because a cosine distance (lower is better, ~0-2) and a BM25 score (higher is better, unbounded)</text>
<text x="60" y="416" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b">are not comparable quantities - normalising them into one number would invent a scale that does not exist.</text>
</svg>
